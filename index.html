<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kad Ajaib Jawi – JawiQuest: Misi Dunia Jawi</title>
  <!-- Fon Rumi ceria untuk kanak-kanak & Fon Jawi tepat RTL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFFDF6;
      --grid-line: rgba(148, 197, 235, 0.28);
      --margin-red: rgba(248, 113, 113, 0.35);
      --yellow-soft: #FEF08A;
      --yellow-card: #FFFBEB;
      --blue-soft: #E0F2FE;
      --blue-accent: #0284C7;
      --blue-btn: #38BDF8;
      --mint-soft: #DCFCE7;
      --mint-accent: #059669;
      --mint-btn: #34D399;
      --orange-soft: #FFEDD5;
      --orange-accent: #EA580C;
      --orange-btn: #FB923C;
      --purple-soft: #F3E8FF;
      --purple-accent: #7E22CE;
      --text-dark: #1E293B;
      --text-muted: #475569;
      --card-shadow: 0 12px 28px -6px rgba(30, 41, 59, 0.14), 0 4px 10px -2px rgba(30, 41, 59, 0.06);
      --radius-lg: 26px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      color: var(--text-dark);
      background-color: var(--bg-cream);
      /* Corak kertas nota grid buku latihan */
      background-image:
        linear-gradient(90deg, transparent 36px, var(--margin-red) 36px, var(--margin-red) 38px, transparent 38px),
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Tulisan Jawi Tepat & Besar */
    .jawi {
      font-family: 'Noto Naskh Arabic', 'Amiri', 'Traditional Arabic', serif;
      direction: rtl;
      unicode-bidi: isolate;
      line-height: 1.5;
      font-weight: 700;
    }

    /* Bar Atas (Header) */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-pill {
      background: #FFFFFF;
      border: 2.5px solid #FDE047;
      border-radius: 999px;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #854D0E;
      box-shadow: 0 3px 0 #FACC15;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-badge {
      background: #FEF9C3;
      border: 2.5px solid #FACC15;
      border-radius: 999px;
      padding: 6px 16px;
      font-weight: 700;
      font-size: 1.05rem;
      color: #854D0E;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #EAB308;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .star-badge.pop {
      transform: scale(1.22);
    }

    .btn-pill {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-pill:active {
      transform: translateY(2px);
    }

    .btn-home {
      background: #FFFFFF;
      color: var(--text-dark);
      border: 2px solid #CBD5E1;
      box-shadow: 0 3px 0 #CBD5E1;
    }

    .btn-review-top {
      background: var(--orange-soft);
      color: var(--orange-accent);
      border: 2px solid #FDBA74;
      box-shadow: 0 3px 0 #FDBA74;
    }

    /* Kontena Utama */
    .app-container {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 18px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Halaman Utama */
    .hero-box {
      text-align: center;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 28px 22px;
      border: 3px solid #BAE6FD;
      box-shadow: var(--card-shadow);
      position: relative;
      margin-bottom: 24px;
    }

    .washi-tape {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      width: 130px;
      height: 26px;
      background: rgba(253, 224, 71, 0.78);
      border-left: 2px dashed rgba(202, 138, 4, 0.35);
      border-right: 2px dashed rgba(202, 138, 4, 0.35);
      border-radius: 4px;
    }

    .hero-title {
      font-size: clamp(2rem, 5vw, 2.85rem);
      margin: 6px 0 8px;
      color: #0369A1;
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 0 #E0F2FE;
    }

    .hero-subtitle {
      font-size: clamp(1.1rem, 2.6vw, 1.3rem);
      color: var(--text-muted);
      margin: 0;
      font-weight: 500;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 22px;
    }

    .mission-card {
      border-radius: var(--radius-lg);
      padding: 26px 22px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.25s ease;
    }
